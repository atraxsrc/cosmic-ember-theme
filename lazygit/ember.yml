# Ember for lazygit, part of cosmic-ember-theme (MIT). Only the colours: your
# own ~/.config/lazygit/config.yml keeps the rest.
#
# Install: ./lazygit/install.sh puts this in ~/.config/lazygit/ember.yml and
# zsh/ember.zsh sets LG_CONFIG_FILE to "config.yml,ember.yml" so lazygit
# reads both (the later file wins). Without the zsh layer:
#   export LG_CONFIG_FILE="$HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/ember.yml"
gui:
  theme:
    activeBorderColor:
      - "#E8713A"
      - bold
    inactiveBorderColor:
      - "#7C8290"
    searchingActiveBorderColor:
      - "#D9A441"
      - bold
    optionsTextColor:
      - "#808693"
    selectedLineBgColor:
      - "#2D3036"
    inactiveViewSelectedLineBgColor:
      - "#15171C"
    cherryPickedCommitFgColor:
      - "#1B1E24"
    cherryPickedCommitBgColor:
      - "#D9A441"
    markedBaseCommitFgColor:
      - "#1B1E24"
    markedBaseCommitBgColor:
      - "#8FB58A"
    unstagedChangesColor:
      - "#D85A5A"
    defaultFgColor:
      - "#D6D9E0"
  authorColors:
    "*": "#D9A441"
