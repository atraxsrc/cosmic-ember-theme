# Ember colour scheme for qt5ct / qt6ct, part of cosmic-ember-theme (MIT).
# The rice's window colour for windows, its containers for buttons and
# tooltips, its text colour, the accent as highlight with the button text
# colour on it, dim placeholders.
#
# Install: ./qt/install.sh puts this in ~/.config/qt5ct/colors/ and
# ~/.config/qt6ct/colors/. Then in qt5ct / qt6ct: Appearance -> Color scheme
# -> Ember, Palette: Custom, Apply. Qt apps need QT_QPA_PLATFORMTHEME=qt5ct
# (or qt6ct) in the environment to read it.
#
# Roles, in order: WindowText, Button, Light, Midlight, Dark, Mid, Text,
# BrightText, ButtonText, Base, Window, Shadow, Highlight, HighlightedText,
# Link, LinkVisited, AlternateBase, NoRole, ToolTipBase, ToolTipText,
# PlaceholderText
[ColorScheme]
active_colors=#d6d9e0, #22262e, #7c8290, #3e4147, #15171c, #1b1e24, #d6d9e0, #e2e4e9, #d6d9e0, #15171c, #15171c, #15171c, #e8713a, #15171c, #e8713a, #d9a441, #22262e, #15171c, #22262e, #d6d9e0, #7c8290
disabled_colors=#5a6070, #22262e, #7c8290, #3e4147, #15171c, #1b1e24, #5a6070, #808693, #5a6070, #15171c, #15171c, #15171c, #7c8290, #808693, #7c8290, #7c8290, #22262e, #15171c, #22262e, #d6d9e0, #7c8290
inactive_colors=#d6d9e0, #22262e, #7c8290, #3e4147, #15171c, #1b1e24, #d6d9e0, #e2e4e9, #d6d9e0, #15171c, #15171c, #15171c, #e8713a, #15171c, #e8713a, #d9a441, #22262e, #15171c, #22262e, #d6d9e0, #7c8290
